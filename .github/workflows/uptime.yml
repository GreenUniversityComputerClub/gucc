name: Uptime

# Every 30 minutes: the API's /health and the website's home page must answer. A failed run
# emails whoever watches this repository's Actions (GitHub notification settings).
# GitHub pauses scheduled workflows after 60 days without repository activity; re-enable it
# from the Actions tab if that happens.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.API_URL || 'https://gucc-api.gucc.workers.dev' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://gucc.green.edu.bd' }}
    steps:
      - name: API health
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 10 --max-time 20 "$API_URL/health")
          echo "$body"
          grep -q '"ok":true' <<< "$body" || { echo "::error::The API answered but did not report ok."; exit 1; }
      - name: Website home page
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --max-time 30 "$SITE_URL/")
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::$SITE_URL answered HTTP $code."; exit 1; }

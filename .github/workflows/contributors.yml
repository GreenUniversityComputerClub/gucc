name: Contributor ranking

# Recomputes the footer's contributor order from the full history (commits and lines of
# authored code; generated files excluded) and stores it in D1 ("site.contributors").
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * 0' # Monday 02:00 Dhaka time
  workflow_dispatch:

concurrency:
  group: contributors
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rank:
    runs-on: ubuntu-latest
    environment: production
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Compute and store the ranking
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; computing only (the site keeps its current order)."
            bun scripts/platform/contributors.ts
          else
            bun scripts/platform/contributors.ts --apply --target production --confirm-production
          fi
